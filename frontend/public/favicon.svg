<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#065f46"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado Elegante -->
  <rect width="64" height="64" rx="16" fill="#064e3b"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad)" stroke="#10b981" stroke-width="1.5"/>

  <!-- Cinta Tricolor de Bolivia en esquina superior derecha -->
  <g opacity="0.95">
    <path d="M40 6 L58 6 A4 4 0 0 1 60 8 L60 14 Z" fill="#ef4444"/>
    <path d="M46 6 L59 6 A3 3 0 0 1 60 7 L60 11 Z" fill="#eab308"/>
    <path d="M52 6 L60 6 L60 8 Z" fill="#22c55e"/>
  </g>

  <!-- Birrete y Libro de Educación -->
  <!-- Tapa del birrete -->
  <path d="M32 15 L14 25.5 L32 36 L50 25.5 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Cuerpo inferior / Base académica -->
  <path d="M21 30.5 V41 C21 44.5 26 47.5 32 47.5 C38 47.5 43 44.5 43 41 V30.5 L32 37 L21 30.5 Z" fill="#d1fae5"/>
  
  <!-- Borla dorada -->
  <path d="M47 27.5 V38.5 C47 39.5 46 40.5 45 40.5 C44 40.5 43 39.5 43 38.5 V29.8 Z" fill="#fde047"/>
  <circle cx="45" cy="40.5" r="2" fill="#f59e0b"/>
  <circle cx="32" cy="25.5" r="2.2" fill="#10b981"/>
</svg>
